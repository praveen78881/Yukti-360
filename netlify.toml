[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Netlify secret scanning:
  # These are CLIENT-SIDE (VITE_*) values that are public by design — Vite inlines
  # them into the browser bundle, so the scanner sees them and (wrongly) fails the
  # build. They are not secrets: the Supabase URL + anon key are meant to be public
  # (protected by RLS), and the Gemini model name is not sensitive. Exclude them.
  # GEMINI_API_KEY is server-side (used by the Netlify function) and is NOT omitted,
  # so the scanner will BLOCK the deploy if it ever leaks into the client bundle.
  # VITE_GEMINI_API_KEY is intentionally NOT listed — the client must never carry a
  # Gemini key; if one reappears in the bundle the scanner should fail the build.
  # SANDBOX_ENV is a mode flag ("test"/"live"), not a credential — its value is a
  # plain word that appears all over docs and code, so the scanner false-positives.
  # The actual Sandbox credentials (SANDBOX_*_KEY / SANDBOX_*_SECRET) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GEMINI_MODEL,SANDBOX_ENV"

# Netlify serverless functions
[functions]
  directory = "netlify/functions"

# SPA fallback — all routes serve index.html (React Router handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
