<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITR-6 &mdash; ITR Information &middot; A.Y. 2026-27</title>
<style>
/* ============================================================
   Universal Tax-Form UI Design System — tokens
   ============================================================ */
:root{
  --blue:#1b4f82; --blue-d:#153f69; --blue-ln:#0e3053;
  --page:#eef1f4;
  --frame:#a9b8c6;
  --ln:#cfd8e0;
  --hd:#dde5ec; --hd-bd:#9db0c1;
  --txt:#20303c; --mut:#5d7181;
  --in:#fffdf2;   --in-bd:#bfae7e;      /* cream  = user types here      */
  --calc:#e6edf4; --calc-bd:#b3c4d4;    /* grey-blue = software computed */
  --ovr:#e7f5ec;  --ovr-bd:#7fb894;     /* green  = computed, overridable*/
  --na:#fae4ea;   --na-bd:#d9a1b2;      /* pink   = unavailable here     */
  --red:#b7202e;
  --tag:#20567f;
  --wht:#ffffff;
  --hover:#f6f9fc; --zebra:#f7f9fb; --th:#eef3f7; --sec-bg:#f0f4f8; --ln-lt:#edf1f5;
  --sub:#33495c;  --lbl:#31485c;   --drill:#7d8fa0; --blue-sl:#c3d9ef; --blue-h:#e2ecf6;
  --tot:#d7e3ef;  --tot-bd:#8ea6bd;                 /* footing / grand-total band     */
  --gr-bg:#eaf6ee;--gr-bd:#a9cdb6; --gr-tx:#1d5c34; /* satisfied / tallied            */
  --rd-bg:#fdeef1;--rd-bd:#e2b3bb;                  /* mandatory pending              */
  --na-tx:#8b5566;
  --focus-bg:#f3fbf6; --focus-ln:#3f8f5a;
  --nt-bg:#fff8e6;--nt-bd:#e4d5a5; --nt-tx:#5a4a20; /* statutory note strip           */
  --pill-bg:#f4f7fa;
  --mono:"Consolas","DejaVu Sans Mono","Courier New",monospace;
  --ui:"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--txt);font:12.5px/1.25 var(--ui);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font-family:var(--ui)}

/* ---------- .top ------------------------------------------ */
.top{position:sticky;top:0;z-index:40;height:44px;background:var(--blue);color:var(--wht);
     display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--blue-ln)}
.top .fm{font-size:13.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.top .fm i{font-style:normal;opacity:.55;padding:0 4px}
.top .sl{flex:1;min-width:0;font-size:11.5px;color:var(--blue-sl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ay{flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:4px;
    padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.nextbtn{flex:none;height:24px;padding:0 10px;border:1px solid rgba(255,255,255,.5);border-radius:4px;
    background:rgba(255,255,255,.1);color:var(--wht);font-size:11.5px;font-weight:600;cursor:pointer}
.nextbtn:hover{background:rgba(255,255,255,.2)}

/* ---------- .clientbar ------------------------------------ */
.clientbar{position:sticky;top:44px;z-index:39;height:30px;background:var(--wht);border-bottom:1px solid var(--frame);
     display:flex;align-items:center;padding:0 12px;overflow:hidden}
.cf{display:flex;align-items:center;gap:5px;padding-right:9px;margin-right:9px;border-right:1px solid var(--ln);flex:none}
.cf:last-child{border-right:0}
.cf label{font-size:11px;color:var(--mut);white-space:nowrap}
.cf .f{height:19px}

/* ---------- the sheet ------------------------------------- */
.sheetwrap{max-width:1120px;margin:0 auto;padding:8px 10px 44px}
.itpage{background:var(--wht);border:1px solid var(--frame)}
.sheetnote{text-align:center;font-size:12px;font-weight:600;padding:5px 8px;background:var(--zebra);border-bottom:1px solid var(--ln)}

.it-head{display:flex;align-items:center;height:26px;background:var(--hd);
     border-top:1px solid var(--hd-bd);border-bottom:1px solid var(--hd-bd);cursor:pointer;user-select:none}
.it-head:first-of-type{border-top:0}
.it-head .ht{flex:1;min-width:0;display:flex;align-items:center;gap:5px;padding-left:4px;
     font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-head .tg{flex:none;width:13px;text-align:center;color:var(--mut);font-weight:700;font-size:12px}
.it-head .hdd{flex:none;width:26px}
.it-head .hv{flex:none;width:272px;display:flex;gap:4px}
.it-head .hs{flex:none;width:76px;text-align:center;color:var(--tag);font-size:11px;font-weight:700}
.it-grp{padding:3px 0 6px}
.it-grp.closed{display:none}

.itr{display:flex;align-items:center;height:28px}
.itr:hover{background:var(--hover)}
.itr.focus{background:var(--focus-bg);box-shadow:inset 0 0 0 1px var(--focus-ln)}
.lbl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding-right:8px}
.lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl.red .lt{color:var(--red);font-weight:600}
.lbl.tot .lt{font-weight:700}
.lbl.c{justify-content:center;font-weight:700}
.drillcol{flex:none;width:26px;display:flex;align-items:center;justify-content:center;color:var(--drill);line-height:1}
.drillcol.sf-open{cursor:pointer;letter-spacing:1.5px;font-size:13px;border-radius:3px}
.drillcol.sf-open:hover{color:var(--blue);background:var(--blue-h)}
.vz{flex:none;width:272px;display:flex;gap:4px}
.vc{flex:none;width:134px;display:flex;align-items:center}
.sch{flex:none;width:76px;text-align:center;color:var(--tag);font-size:11px;font-weight:700;letter-spacing:.2px}

.it-sub{display:flex;align-items:center;height:24px;padding-left:26px;font-size:12px;font-weight:600;color:var(--sub)}
.it-sub.red{color:var(--red)}
.it-note{padding:1px 0 2px 26px;font-size:11px;color:var(--mut)}
.hid{display:none !important}

.help{flex:none;width:13px;height:13px;border-radius:50%;background:var(--blue);color:var(--wht);font-size:9px;
      font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help}

/* ---------- fields: colour = provenance -------------------- */
.f{width:100%;height:20px;border:1px solid var(--in-bd);background:var(--in);color:var(--txt);
   font:12.5px/18px var(--ui);padding:0 5px;border-radius:2px;outline:none}
.f:focus{border-color:var(--blue);box-shadow:inset 0 0 0 1px rgba(27,79,130,.3)}
.f.n,.f.d{font-family:var(--mono);font-size:12px;text-align:right}
select.f{padding:0 2px;cursor:pointer}
.f.ovr{background:var(--ovr);border-color:var(--ovr-bd)}
.f.na,.cv.na,.st.na{background:var(--na);border-color:var(--na-bd);color:var(--na-tx)}
.f[disabled]{cursor:not-allowed}
.cv{width:100%;height:20px;border:1px solid var(--calc-bd);background:var(--calc);border-radius:2px;
    font-family:var(--mono);font-size:12px;padding:0 5px;display:flex;align-items:center;justify-content:flex-end;
    color:var(--txt);overflow:hidden}
.cv.tot{font-weight:700;background:var(--tot);border-color:var(--tot-bd)}
.st{width:100%;height:20px;border:1px solid var(--calc-bd);background:var(--calc);border-radius:2px;font-size:11.5px;
    padding:0 5px;display:flex;align-items:center;justify-content:flex-end;color:var(--mut);cursor:pointer;overflow:hidden}
.st:hover{border-color:var(--blue)}
.st.ok{color:var(--gr-tx);font-weight:600}
.st.req{color:var(--red);font-weight:700}

.reqmark-unused{
    color:var(--red);border:1px solid var(--rd-bd);background:var(--rd-bg);border-radius:3px;padding:0 4px;line-height:13px}
.reqmark.ok{color:var(--gr-tx);border-color:var(--gr-bd);background:var(--gr-bg);letter-spacing:0}

.yn-tabs{display:inline-flex;height:20px;border:1px solid var(--in-bd);border-radius:3px;background:var(--in);overflow:hidden}
.yn-tabs button{width:36px;border:0;background:transparent;color:var(--mut);font-size:11.5px;line-height:18px;cursor:pointer;padding:0}
.yn-tabs button+button{border-left:1px solid var(--in-bd)}
.yn-tabs button.on{background:var(--blue);color:var(--wht);font-weight:700}
.yn-tabs.na{background:var(--na);border-color:var(--na-bd)}
.yn-tabs.na button{cursor:not-allowed}

/* ---------- .rail ----------------------------------------- */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:41;height:30px;background:var(--wht);border-top:1px solid var(--frame);
      display:flex;align-items:center;gap:7px;padding:0 12px;font-size:11.5px;overflow:hidden}
.pill{flex:none;border:1px solid var(--ln);background:var(--pill-bg);border-radius:4px;padding:2px 8px;color:var(--lbl);white-space:nowrap}
.pill b{font-family:var(--mono);font-weight:700}
.pill.red{border-color:var(--na-bd);background:var(--rd-bg);color:var(--red);font-weight:700}
.pill.gr{border-color:var(--gr-bd);background:var(--gr-bg);color:var(--gr-tx)}
.pill.hid{display:none}
.spacer{flex:1}

/* ---------- .subform (full-screen takeover) ---------------- */
.subform{position:fixed;inset:0;z-index:60;background:var(--page);overflow:auto;display:none}
.subform.open{display:block}
.subform.lvl2{z-index:70}
.sf-top{position:sticky;top:0;z-index:2;height:42px;background:var(--blue);color:var(--wht);
        display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--blue-ln)}
.sf-ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-sub{flex:none;font-size:11.5px;color:var(--blue-sl)}
.sf-done{flex:none;height:24px;padding:0 12px;border:1px solid var(--wht);border-radius:4px;background:var(--wht);
         color:var(--blue);font-size:12px;font-weight:700;cursor:pointer}
.sf-done:hover{background:var(--blue-h)}
.sf-body{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
.subform.sf-wide .sf-body{max-width:none}
.sf-note{background:var(--nt-bg);border:1px solid var(--nt-bd);border-radius:3px;padding:6px 8px;margin-bottom:10px;
         font-size:11.5px;color:var(--nt-tx)}
.sf-sec{background:var(--wht);border:1px solid var(--frame);margin-bottom:10px}
.sf-sectit{display:flex;align-items:center;gap:10px;height:26px;padding:0 8px;background:var(--hd);
           border-bottom:1px solid var(--hd-bd);font-size:12px;font-weight:700}
.sf-sectit .n{font-size:11px;font-weight:400;color:var(--mut)}
.addbtn{margin-left:auto;height:19px;padding:0 8px;border:1px solid var(--blue);border-radius:3px;background:var(--wht);
        color:var(--blue);font-size:11px;font-weight:700;cursor:pointer}
.addbtn:hover{background:var(--blue-h)}
.sf-tbl{width:100%;table-layout:fixed;border-collapse:collapse}
.sf-tbl th{height:24px;background:var(--th);border:1px solid var(--ln);padding:3px 5px;text-align:left;
           font-size:11px;font-weight:600;color:var(--lbl);vertical-align:middle}
.sf-tbl th.num{text-align:right}
.sf-tbl td{height:26px;border:1px solid var(--ln);padding:1px 3px;vertical-align:middle}
.sf-tbl td.sn{text-align:center;font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--zebra)}
.sf-tbl td.mdc{font-size:11.5px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-tbl td.mdc.num{text-align:right;font-family:var(--mono);font-size:11.5px}
.sf-tbl tfoot td{background:var(--tot);border-color:var(--tot-bd);font-weight:700;font-family:var(--mono);text-align:right;padding:0 5px}
.sf-tbl tfoot td.lab{font-family:var(--ui);text-align:right;font-weight:700}
.rm,.edt{width:100%;height:19px;border:1px solid var(--ln);border-radius:3px;background:var(--zebra);cursor:pointer;
         font-size:11px;color:var(--mut);padding:0}
.rm:hover{border-color:var(--na-bd);background:var(--rd-bg);color:var(--red)}
.edt{border-color:var(--blue);color:var(--blue);background:var(--wht);font-weight:700}
.edt:hover{background:var(--blue-h)}
.emptyrow td{height:26px;text-align:center;color:var(--mut);font-size:11.5px;background:var(--zebra)}

/* fixed break-up list: Particulars | Amount... */
.sf-tbl td.bl{font-size:12px;color:var(--txt);padding:2px 6px;white-space:normal;line-height:1.3}
.sf-tbl td.bh{font-size:12px;font-weight:700;color:var(--lbl);background:var(--sec-bg);padding:0 6px}
.sf-tbl td.bi{padding-left:26px}
.sf-tbl td.bi2{padding-left:44px}
.sf-tbl tr.gap td{height:8px;background:var(--zebra);border-left-color:transparent;border-right-color:transparent}

.tabbar{display:flex;gap:0;height:28px;padding:0 10px;background:var(--hd);border-bottom:1px solid var(--hd-bd)}
.tab{height:28px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;
     font-family:var(--ui);font-size:12px;font-weight:600;color:var(--mut)}
.tab:hover{color:var(--blue)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);background:var(--wht)}

.vpane{max-width:1180px;margin:0 auto;padding:10px 0 40px}
.vhead{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;background:var(--wht);
       border:1px solid var(--frame);font-size:13px;font-weight:700}
.vbtn{margin-left:auto;height:24px;padding:0 14px;border:1px solid var(--blue);border-radius:4px;
      background:var(--blue);color:var(--wht);font-size:12px;font-weight:700;cursor:pointer}
.vbtn:disabled{background:var(--zebra);border-color:var(--ln);color:var(--mut);cursor:not-allowed}
.vbtn.sec{background:var(--wht);color:var(--blue)}
.vlist{background:var(--wht);border:1px solid var(--frame);border-top:0}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:5px 12px;border-bottom:1px solid var(--ln-lt);font-size:12px}
.vrow:last-child{border-bottom:0}
.vrow .vk{flex:none;width:70px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
          padding-top:1px}
.vrow.err .vk{color:var(--red)} .vrow.warn .vk{color:#8a6d1f} .vrow.ok .vk{color:var(--gr-tx)}
.vrow .vp{flex:none;width:230px;color:var(--mut);font-size:11.5px}
.vrow .vm{flex:1}
.vrow a{color:var(--blue);cursor:pointer;text-decoration:underline}
.vsum{padding:8px 12px;font-size:12px;color:var(--mut);background:var(--zebra);border:1px solid var(--frame);border-top:0}

.sf-fields{display:grid;grid-template-columns:1fr 1fr}
.sf-fields.one{grid-template-columns:1fr}
.ff.hd{grid-column:1/-1;height:24px;background:var(--sec-bg);border-bottom:1px solid var(--ln);
       font-size:12px;font-weight:700;color:var(--lbl)}
.ff.gap{grid-column:1/-1;height:8px;background:var(--zebra)}
.ff{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-bottom:1px solid var(--ln-lt)}
.ff.w{grid-column:1/-1}
.ff label{flex:none;width:290px;font-size:12px;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff .f{flex:none;width:210px}
.ff.w .f{flex:1;width:auto;max-width:660px}
.ff.q{height:auto;min-height:28px;padding-top:4px;padding-bottom:4px}
.ff.q label{width:auto;flex:1;white-space:normal;line-height:1.3;overflow:visible;text-overflow:clip}
.ff.q .f{flex:none;width:210px;max-width:210px}
.ff .cv{flex:none;width:210px}

.sf-grand{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;background:var(--tot);
          border:1px solid var(--tot-bd);font-size:12.5px;font-weight:700}
.sf-grand .gv{margin-left:auto;font-family:var(--mono)}
.sf-detit{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;background:var(--sec-bg);
          border-bottom:1px solid var(--ln);font-size:11.5px;font-weight:600;color:var(--lbl)}

/* ---------- column-width vocabulary (verbatim) ------------- */
.c-txt{width:150px}
.c-txtwide{width:200px}
.c-num{width:120px}
.c-sel{width:150px}
.c-zip{width:80px}
.c-date{width:130px}
.c-tag{width:90px}
.c-rm{width:34px}
.c-chk{width:80px}
.c-edit{width:70px}
.c-sn{width:34px}
.c-selwide{width:320px}
.c-part{width:440px}
.c-fill{width:auto}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="fm">ITR-6 <i>&middot;</i> <span id="scrname">ITR Information</span></div>
    <div class="sl" id="topsub">&mdash;</div>
    <div class="ay">A.Y. 2026-27</div>
    <button class="nextbtn" id="btnNext">Go to next &rarr;</button>
  </div>

  <div class="tabbar">
    <button class="tab on" data-scr="itr">ITR Info</button>
    <button class="tab" data-scr="comp">IT Computation</button>
    <button class="tab" data-scr="val">Validate &amp; Export</button>
  </div>

  <div class="clientbar">
    <div class="cf"><label>Name</label><input class="f" id="cl_name" data-p="cl.name" style="width:186px" placeholder="Name of the company"></div>
    <div class="cf"><label>PAN</label><input class="f" id="cl_pan" data-p="cl.pan" style="width:98px;text-transform:uppercase" maxlength="10" placeholder="AAAAA0000A"></div>
    <div class="cf"><label>Status</label><select class="f" id="cl_status" data-p="cl.status" data-cat="CO_KIND" style="width:152px"></select></div>
    <div class="cf"><label>Residential Status</label><select class="f" id="cl_resid" data-p="cl.resid" data-cat="RESID" style="width:118px"></select></div>
    <div class="cf"><label>Date of Incorporation</label><input class="f" id="cl_doi" data-p="cl.doi" style="width:88px" placeholder="DD/MM/YYYY" maxlength="10"></div>
  </div>

  <div class="vpane" id="valpane" style="display:none">
    <div class="vhead"><span>Validation</span><span class="sf-sub" id="v_when"></span>
      <button class="vbtn sec" id="btnValidate">Run validation</button>
      <button class="vbtn" id="btnExport" disabled>Download JSON</button></div>
    <div class="vlist" id="v_list"></div>
    <div class="vsum" id="v_sum">Not run yet.</div>
  </div>

  <div class="sheetwrap">
    <div class="itpage" id="itpage">
      <div class="sheetnote">(For Companies other than companies claiming exemption under section 11)</div>
    </div>
  </div>
</div>

<div class="rail">
  <span class="pill" id="r_core">Basic info. <b>0/4</b></span>
  <span class="pill" id="r_bs">B/S <b>&mdash;</b></span>
  <span class="pill" id="r_pl">PAT <b>0</b></span>
  <span class="pill" id="r_fa">FA <b>off</b></span>
  <span class="spacer"></span>
  <span class="pill" id="r_status">Status: —</span>
</div>

<script>
"use strict";
/* ==================================================================
   0 · Const catalogs — options are never hand-written in HTML
   ================================================================== */
const YN        = ["","Yes","No"];
const STATUSES  = ["Domestic Company","Foreign Company"];
const RESID     = ["","Resident","Non-Resident"];
const SECTIONS  = ["","139","142(1)","148","153A","153C","119(2)(b)","92CD"];
const RETTYPES  = ["","Original","Revised","Belated","Updated u/s 139(8A)","Modified u/s 92CD","Defective u/s 139(9) - response"];
const CO_PUBPVT = ["","Private Company","Public Company"];
const CO_KIND   = ["","Domestic Company","Foreign Company","Company in which public are substantially interested","Company in which public are not substantially interested"];
const ACC_TYPE  = ["","Current","Savings","Cash Credit","Overdraft"];
const DESIGNATN = ["","Managing Director","Director","Whole-time Director","Independent Director","Nominee Director","Company Secretary","Principal Officer","Manager","Chief Executive Officer","Chief Financial Officer","Liquidator","Authorised Representative"];
const SHARE_TYP = ["","Equity","Preference"];
const CESS_MODE = ["","Transfer","Buy back","Redemption","Reduction of capital","Other:"];
const HOLDKIND  = ["","Holding Company","Subsidiary Company","Both","Associate / Joint Venture"];
const DM_KIND   = ["","Demerged company","Resulting company","Amalgamating company","Amalgamated company"];
const REGULATOR = ["","Reserve Bank of India (RBI)","Insurance Regulatory and Development Authority (IRDA)","Securities and Exchange Board of India (SEBI)","Pension Fund Regulatory and Development Authority (PFRDA)","Public Sector Company","National Housing Bank (NHB)","Other Regulator"];
const PTI_ENT   = ["","115U - Venture Capital","115UA - Business Trust","115UB - Investment Fund"];
const PTI_HEAD  = ["","House Property","Capital Gains - Short Term","Capital Gains - Long Term","Other Sources","Business or Profession","Income claimed to be exempt"];
const AUDIT_SEC = ["","10AA","115JB","115VW","33AB","33ABA","44DA","50B","80-IA","80-IAB","80-IAC","80-IB","80-IE","80JJAA","80LA","92E","Other:"];
const AUDIT_ACT = ["","Banking Regulation Act, 1949","Central Excise Act, 1944","Central GST Act, 2017","Central Sales Tax Act, 1956","Charitable and Religious Trusts Act, 1920","Companies Act, 2013","Electricity Act, 2003","Employees Provident Fund and Miscellaneous Provisions Act, 1952","Foreign Exchange Management Act, 1999","Government Superannuation Fund Act, 1956","Integrated GST Act, 2017","Other:","Payment of Gratuity Act, 1972","SEBI Act, 1992","Securities Contract (Regulation) Act, 1956","State GST Act, 2017","Union Territories GST Act, 2017"];
const CAP_KIND  = ["","Partnership Firm","LLP","AOP","BOI","Joint Venture"];

 {k:"r", t:"TDS on which no TAN is available \u2014 26QB / 26QC / 26QD (Schedule TDS3)", tot:"claimed", cols:[
  ["pan","PAN / Aadhaar of the deductor","txt"],["name","Name of the deductor","txtwide"],
  ["gross","Gross amount","n"],["deducted","Tax deducted","n"],["claimed","TDS credit claimed","n"]]}
]},
tp_tcs:{title:"TCS", unit:"entries", grand:"Total TCS credit claimed",
 secs:[{k:"r", t:"Schedule TCS", tot:"claimed", cols:[
  ["tan","TAN of the collector","txt"],["name","Name of the collector","txtwide"],
  ["collected","Tax collected","n"],["claimed","TCS credit claimed","n"]]}]}

};
/* ==================================================================
   3 · State  —  the DOM is only a projection of these objects
   ================================================================== */
const S = {
  v  : {sec:"139", rettype:"Original", td:"No", fa:"No", ol:"No", indas:"No", mtpl:"Yes", mfgac:"No"},
  p  : {},                                       /* single-record + break-up fields */
  r  : {},                                       /* repeater / master-detail rows   */
  ovr: {},                                       /* overrides of green cells        */
  C  : {}                                        /* computed                        */
};
const SECOF={}, SPECOF={}, FACT={}, CUR={};
const CLS={txt:"c-txt",txtwide:"c-txtwide",n:"c-num",dec:"c-num",sel:"c-sel",selwide:"c-selwide",
           zip:"c-zip",date:"c-date",tag:"c-tag",chk:"c-chk",
           nicsect:"c-selwide",nicsub:"c-selwide",niccode:"c-tag"};
const DET_RE=/^(codet|aldet|fadet)_(.+)$/;

/* ---- helpers -------------------------------------------------- */
const $  = id => document.getElementById(id);
const esc= s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num= v => {const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?Math.round(n):0};
const fmt= n => n?Number(n).toLocaleString("en-IN",{maximumFractionDigits:0}):"";
const V  = k => num(S.v[k]);
const P  = (k,f) => num(S.p[k+"."+f]);
const optsHTML=(arr,v)=>(arr||[]).map(o=>`<option value="${esc(o)}"${o===(v||"")?" selected":""}>${esc(o||"— select —")}</option>`).join("");
const condOn = c => !c ? true : (c==="mfgac" ? (S.v.mtpl==="Yes"&&S.v.mfgac==="Yes")
                               : c.split(",").every(x=>S.v[x]==="Yes"));
const findField=(s,key)=>{let r=null;(s.g||[]).forEach(g=>g[1].forEach(f=>{if(f[0]===key)r=f}));return r};
const flags = r => (r[2]||"").split(" ");
const bCols = s => s.cols || [["","Amount"]];
const bKey  = (k,r,c) => k+"."+r[0]+(c[0]?"_"+c[0]:"");
const nicList = (s,r) => s.nic[r.sect] || [];
const nicCode = (s,r) => {const f=nicList(s,r).find(x=>x[0]===r.sub); return f?f[1]:""};

/* every editable cell of a break-up section */
function bIds(k,s){
  const out=[];
  s.rows.forEach(r=>{const f=flags(r);
    if(f.includes("h")||f.includes("s")||f.includes("c")) return;
    bCols(s).forEach(c=>{ if(!(s.ccols||[]).includes(c[0])) out.push(bKey(k,r,c)); });});
  return out;
}

function ctlHTML(f,v,attrs){
  const ty=f[2],cat=f[3];
  if(ty==="sel"||ty==="selwide") return `<select class="f" ${attrs}>${optsHTML(CAT[cat],v)}</select>`;
  if(ty==="n")    return `<input class="f n" inputmode="numeric" ${attrs} value="${esc(fmt(num(v)))}">`;
  if(ty==="dec")  return `<input class="f d" inputmode="decimal" ${attrs} value="${esc(v||"")}">`;
  if(ty==="date") return `<input class="f" ${attrs} placeholder="DD/MM/YYYY" maxlength="10" value="${esc(v||"")}">`;
  if(ty==="chk")  return `<input type="checkbox" ${attrs}${v==="Y"?" checked":""}>`;
  if(ty==="zip")  return `<input class="f" ${attrs} maxlength="10" value="${esc(v||"")}">`;
  return `<input class="f" ${attrs} value="${esc(v||"")}">`;
}

/* ---- factories: the shape of a row is defined once, by the spec  */
function mkFactory(s){
  const keys=[];
  (s.cols||[]).forEach(c=>{ if(c[2]!=="niccode") keys.push(c[0]); });   /* the code is derived, never stored */
  (s.g||[]).forEach(g=>g[1].forEach(f=>keys.push(f[0])));
  return ()=>{const o={};keys.forEach(k=>o[k]="");return o};
}
Object.keys(SPEC).forEach(k=>{
  const multi = SPEC[k].secs.filter(x=>x.k==="r"||x.k==="m").length>1;
  SPEC[k].secs.forEach((s,i)=>{
    if(s.k!=="r"&&s.k!=="m") return;
    s.key = multi ? k+"_"+i : k;
    SECOF[s.key]=s; SPECOF[s.key]=k; FACT[s.key]=mkFactory(s); S.r[s.key]=[];
  });
});

/* ---- popups that do not simply add up ------------------------- */
function tpsa(){
  const amt=P("tpsa","amt"), t18=Math.round(amt*0.18), sur=Math.round(t18*0.12),
        cess=Math.round((t18+sur)*0.04), totA=t18+sur+cess,
        paidB=(S.r.tpsa||[]).reduce((a,r)=>a+num(r.amt),0);
  return {t18:t18, sur:sur, cess:cess, totA:totA, paidB:paidB, netAB:totA-paidB};
}
const I234C = [["q1",3],["q2",3],["q3",3],["q4",1]];
const CALC={
  cg:         k => P(k,"fvc")-P(k,"coa")-P(k,"coi")-P(k,"exp")-P(k,"ded"),
  i234c:      k => I234C.reduce((a,x)=>a+Math.round(Math.floor(P(k,x[0]+"_short")/100)*100*0.01*x[1]),0),
  bp_spec:    k => P(k,"np")+P(k,"add")-P(k,"ded"),
  bp_35ad:    k => P(k,"np")+P(k,"add")-P(k,"ded")-P(k,"d35ad"),
  mat_bp:     k => P(k,"np")
      + ["a_it","a_res","a_prov","a_divid","a_dividend","a_exempt","a_dep","a_defer","a_reval","a_oth"]
        .reduce((a,f)=>a+P(k,f),0)
      - ["d_res","d_exempt","d_dep","d_reval","d_loss","d_profit","d_oth"].reduce((a,f)=>a+P(k,f),0),
  td_fmvless: k => P(k,"a")+P(k,"b")+P(k,"c")-P(k,"liab"),
  bs_nbfa:    k => P(k,"tgb")-P(k,"tdep")-P(k,"timp")+P(k,"igb")-P(k,"iamo")-P(k,"iimp"),
  tpsa:       k => tpsa().netAB
};

/* ---- the value a popup contributes to the sheet ---------------- */
function popupValue(k){
  const sp=SPEC[k];
  if(sp.nogrand) return null;
  if(sp.calc)    return CALC[sp.calc](k);
  if(sp.val)     return num(S.p[k+"."+sp.val]);
  let t=0,any=false;
  sp.secs.forEach(s=>{
    if(s.k==="f")      s.f.forEach(f=>{ if(f[2]==="n"){any=true;t+=P(k,f[0])} });
    else if(s.k==="b") bIds(k,s).forEach(id=>{any=true;t+=num(S.p[id])});
    else if(s.tot)   { any=true; (S.r[s.key]||[]).forEach(r=>t+=num(r[s.tot])); }
  });
  return any?t:null;
}
const PV = k => popupValue(k)||0;

function statusOf(k){
  const sp=SPEC[k]; let n=0, filled=false;
  sp.secs.forEach(s=>{
    if(s.k==="f")      s.f.forEach(f=>{ if(f[0]&&String(S.p[k+"."+f[0]]||"")!=="") filled=true; });
    else if(s.k==="b") bIds(k,s).forEach(id=>{ if(String(S.p[id]||"")!=="") filled=true; });
    else n += (S.r[s.key]||[]).filter(r=>Object.keys(r).some(x=>String(r[x]||"")!=="")).length;
  });
  if(n){const u=sp.unit||"entries";
    return {txt:n+" "+(n===1?u.replace(/ies$/,"y").replace(/s$/,""):u), ok:true};}
  if(filled) return {txt:"Entered", ok:true};
  return {txt:"Not entered", ok:false};
}

/* ==================================================================

function vcell(r,side){

  let c="";
  switch(r.t){
    case "in":   c=`<input class="f n" inputmode="numeric" ${a} id="f_${r.fld}">`; break;
    case "txt":  c=`<input class="f" ${a} id="f_${r.fld}">`; break;
    case "date": c=`<input class="f" ${a} id="f_${r.fld}" placeholder="DD/MM/YYYY" maxlength="10">`; break;
    case "sel":  c=`<select class="f" ${a} id="f_${r.fld}">${optsHTML(CAT[r.cat],S.v[r.fld])}</select>`; break;
    case "ovr":  c=`<input class="f n ovr" inputmode="numeric" data-ovr="${r.fld}" id="f_${r.fld}" title="Computed — type to override">`; break;
    case "yn":   c=`<div class="yn-tabs" data-fld="${r.fld}"><button data-v="Yes">Yes</button><button data-v="No">No</button></div>`; break;
    case "fig":  c=`<div class="cv" id="${r.id}"></div>`; break;

    case "dnum": c=`<div class="cv" id="${r.id}" data-sf="${r.sf}" title="Open the break-up"></div>`; break;
    case "drill":c=`<div class="st" id="st_${r.sf}" data-sf="${r.sf}"></div>`; break;
  }
  return `<div class="vc">${c}</div>`;
}

function rowHTML(r,sec,i){
  const rid = "row-"+(r.sf||r.fld||(sec.id+"-"+i));
  const pad = r.pl!=null ? r.pl : IND[r.i||0];
  if(r.t==="sub")  return `<div class="it-sub${r.red?" red":""}" id="${rid}" style="padding-left:${pad}px">${esc(r.l)}</div>`;

function buildSheet(){

    h+=`<div class="it-head" data-scr="${sec.scr||"itr"}" data-grp="g-${sec.id}"><div class="ht"><span class="tg">&minus;</span>${esc(sec.t)}</div>`+

/* ==================================================================
   5 · Build the popups (one .subform per topic, ids per §7)
   ================================================================== */
function colg(s){
  let c='<colgroup><col class="c-sn">';
  if(s.k==="r") s.cols.forEach(x=>c+=`<col class="${CLS[x[2]]||"c-txt"}">`);
  else { s.sum.forEach(su=>{const f=findField(s,su[0]); c+=`<col class="${CLS[(f&&f[2])||"txt"]||"c-txt"}">`}); c+='<col class="c-edit">'; }
  return c+'<col class="c-rm"><col class="c-fill"></colgroup>';
}
function thd(s){
  let h='<thead><tr><th>#</th>';
  if(s.k==="r") s.cols.forEach(x=>h+=`<th${(x[2]==="n"||x[2]==="dec")?' class="num"':""}>${esc(x[1])}</th>`);
  else { s.sum.forEach(su=>{const f=findField(s,su[0]); h+=`<th${f&&f[2]==="n"?' class="num"':""}>${esc(su[1])}</th>`}); h+="<th></th>"; }
  return h+"<th></th><th></th></tr></thead>";
}
function tft(s){
  const cols = s.k==="r" ? s.cols.map(c=>c[0]) : s.sum.map(x=>x[0]).concat(["__e"]);
  const ti = cols.indexOf(s.tot); if(ti<0) return "";
  const right = cols.length-ti-1+2;
  return `<tfoot><tr><td class="lab" colspan="${1+ti}">Total</td><td id="tf-${s.key}"></td>`+
         (right?`<td colspan="${right}"></td>`:"")+`</tr></tfoot>`;
}

/* fixed break-up list — Winman's Particulars | Amount grid */
function bHTML(k,s){
  const cols=bCols(s), span=cols.length+2;
  let h='<table class="sf-tbl"><colgroup><col class="c-part">';
  cols.forEach(()=>h+='<col class="c-num">');
  h+='<col class="c-fill"></colgroup><thead><tr><th>'+esc(s.hdr||"")+"</th>";
  cols.forEach(c=>h+=`<th class="num">${esc(c[1])}</th>`);
  h+="<th></th></tr></thead><tbody>";
  s.rows.forEach(r=>{
    const f=flags(r);
    if(f.includes("s")){ h+=`<tr class="gap"><td colspan="${span}"></td></tr>`; return; }
    if(f.includes("h")){ h+=`<tr><td class="bh" colspan="${span}">${esc(r[1])}</td></tr>`; return; }
    h+=`<tr><td class="bl${f.includes("i2")?" bi2":(f.includes("i")?" bi":"")}">${esc(r[1])}</td>`;
    cols.forEach(c=>{
      const comp = f.includes("c") || (s.ccols||[]).includes(c[0]);
      const cid  = "pc_"+k+"_"+r[0]+(cols.length>1&&c[0] ? "_"+c[0] : "");
      h+= "<td>"+(comp ? `<div class="cv" id="${cid}"></div>`
                       : ctlHTML(["","","n"],S.p[bKey(k,r,c)],`data-p="${bKey(k,r,c)}"`))+"</td>";
    });
    h+="<td></td></tr>";
  });
  return h+"</tbody></table>";
}

function fieldsHTML(k,s){
  let h=`<div class="sf-fields${s.one?" one":""}">`;
  s.f.forEach(f=>{
    if(f[2]==="hd")  { h+=`<div class="ff hd"><label>${esc(f[1])}</label></div>`; return; }
    if(f[2]==="gap") { h+=`<div class="ff gap"></div>`; return; }
    const q=f[1].length>60, w=q||f[2]==="txtwide"||f[2]==="selwide";
    h+=`<div class="ff${w?" w":""}${q?" q":""}"><label>${esc(f[1])}</label>`+
       ctlHTML(f,S.p[k+"."+f[0]],`data-p="${k}.${f[0]}"`)+"</div>";
  });
  return h+"</div>";
}

function sfHTML(k){
  const sp=SPEC[k]; let b="";
  if(sp.note) b+=`<div class="sf-note">${esc(sp.note)}</div>`;
  sp.secs.forEach(s=>{
    const list = s.k==="r"||s.k==="m";
    b+=`<div class="sf-sec">`;
    if(list||s.t) b+=`<div class="sf-sectit">${esc(s.t)}`+
       (list?`<button class="addbtn" data-add="${s.key}">+ Add ${s.k==="m"?"entry":"row"}</button>`:"")+`</div>`;
    b += s.k==="f" ? fieldsHTML(k,s)
       : s.k==="b" ? bHTML(k,s)

    b+="</div>";
  });
  if(popupValue(k)!==null) b+=`<div class="sf-grand"><span>${esc(sp.grand||"Total")}</span><span class="gv" id="gt-${k}"></span></div>`;

         `<div class="sf-sub">A.Y. 2026-27</div><button class="sf-done" data-close>&#10003; Done</button></div>`+

function buildGroupedDetail(spec,row,pfx){

function openDetail(fam,key,idx){

function saveDetail(t){
  const m=t.id&&t.id.match(DET_RE); if(!m) return false;
  const cur=CUR[m[1]]; if(!cur) return false;
  cur.row[m[2]] = t.type==="checkbox" ? (t.checked?"Y":"") : t.value;
  renderTbl(cur.key); return true;
}

function renderTbl(key){
  const s=SECOF[key], tb=$("tb-"+key); if(!tb) return;
  const rows=S.r[key]||[], nc=1+(s.k==="r"?s.cols.length:s.sum.length+1)+2;
  let h="";
  if(!rows.length) h=`<tr class="emptyrow"><td colspan="${nc}">No entries yet &mdash; use &ldquo;+ Add ${s.k==="m"?"entry":"row"}&rdquo;.</td></tr>`;
  rows.forEach((r,i)=>{
    h+=`<tr><td class="sn">${i+1}</td>`;
    if(s.k==="r") s.cols.forEach(c=>{
      const a=`data-r="${key}|${i}|${c[0]}"`;
      if(c[2]==="nicsect"){ h+=`<td><select class="f" ${a}>${optsHTML([""].concat(Object.keys(s.nic)),r[c[0]])}</select></td>`; return; }
      if(c[2]==="nicsub") { const L=nicList(s,r).map(x=>x[0]);
        h+=`<td><select class="f" ${a} title="${esc(r[c[0]]||"")}">${optsHTML([""].concat(L),r[c[0]])}</select></td>`; return; }
      if(c[2]==="niccode"){ h+=`<td><div class="cv" id="nic_${key}_${i}">${esc(nicCode(s,r))}</div></td>`; return; }
      h+=`<td${c[2]==="chk"?' style="text-align:center"':""}>`+ctlHTML(c,r[c[0]],a)+"</td>";
    });
    else {
      s.sum.forEach(su=>{const f=findField(s,su[0]),isn=f&&f[2]==="n";
        h+=`<td class="mdc${isn?" num":""}">${esc(isn?fmt(num(r[su[0]])):(r[su[0]]||"&mdash;"))}</td>`});
      h+=`<td><button class="edt" data-${s.fam}edit="${key}|${i}">Edit &#9998;</button></td>`;
    }
    h+=`<td><button class="rm" data-rm="${key}|${i}" title="Remove">&#10005;</button></td><td></td></tr>`;
  });
  tb.innerHTML=h;
  if(s.tot){const tf=$("tf-"+key); if(tf) tf.textContent=fmt(rows.reduce((a,r)=>a+num(r[s.tot]),0));}
}

/* ==================================================================
   6 · computeAll()  —  pure, idempotent, runs on every change
   ================================================================== */
const MMR = 0.34944;                       /* 30% + 12% surcharge + 4% cess */
const ovr = (fld,src)=>{const o=S.ovr[fld];return (o!==undefined&&String(o).trim()!=="")?num(o):src;};

const AL_KEYS=["al_resland","al_othland","al_listed","al_unlisted","al_othsec","al_capcon","al_loans","al_vehicles","al_jewel"];
const PL_PLAIN=["pl_adv","pl_audit","pl_bad","pl_club","pl_comm","pl_conf","pl_stores","pl_convey","pl_donation",
  "pl_entert","pl_festival","pl_freight","pl_gift","pl_guest","pl_hosp","pl_hotel","pl_power","pl_prof","pl_rents",
  "pl_repb","pl_repm","pl_royalty","pl_promo","pl_scholar","pl_staff","pl_tel","pl_travel"];
const FA_KEYS=["fa_dep","fa_eq","fa_ins","fa_fin","fa_imm","fa_cap","fa_sign","fa_trusts","fa_othinc"];

function compute(){
  const C={};
  /* --- Assets / Liabilities (AL-1) --- */
  AL_KEYS.forEach(k=>C["it_"+k]=PV(k));
  C.it_al_total = AL_KEYS.reduce((a,k)=>a+C["it_"+k],0);
  C.it_al_liab  = PV("al_liab");

  /* --- Accreted income u/s 115TD --- */
  C.it_td_netval  = V("td_fmvtot")-V("td_liab");
  C.it_td_fmvless = PV("td_fmvless");
  C.it_td_accr    = C.it_td_netval-C.it_td_fmvless;
  C.it_td_addtax  = Math.round(Math.max(0,C.it_td_accr)*MMR);
  C.it_td_a       = C.it_td_addtax+V("td_int");
  C.it_td_b       = PV("td_paid");
  C.it_td_net     = C.it_td_a-C.it_td_b;

  /* --- Receipt & Payment A/c under liquidation --- */
  C.it_ol_sale=PV("ol_sale"); C.it_ol_roth=PV("ol_roth"); C.it_ol_poth=PV("ol_poth");
  C.it_ol_rtot = V("ol_ob_cash")+V("ol_ob_bank")+V("ol_r_int")+V("ol_r_div")+C.it_ol_sale+V("ol_r_real")+C.it_ol_roth;
  C.it_ol_ptot = V("ol_p_sec")+V("ol_p_unsec")+V("ol_p_cred")+V("ol_p_comm")+C.it_ol_poth+V("ol_cb_cash")+V("ol_cb_bank");

  /* --- Manufacturing A/c --- */
  C.it_mfg_direxp=PV("mfg_direxp"); C.it_mfg_factexp=PV("mfg_factexp");
  C.ov_mfg_cls_rm = ovr("mfg_cls_rm", V("bs_inv_rm"));
  C.it_mfg_cop = condOn("mfgac")
    ? V("mfg_ops_rm")+V("mfg_ops_wip")+V("mfg_purch")+V("mfg_wages")+C.it_mfg_direxp+C.it_mfg_factexp
      -C.ov_mfg_cls_rm-V("mfg_cls_wip")
    : 0;

  /* --- Trading A/c --- */
  C.it_tr_othrev=PV("tr_othrev"); C.it_tr_duties=PV("tr_duties");
  C.ov_tr_clsfg = ovr("tr_clsfg", V("bs_inv_fg"));
  C.it_tr_totinc = V("tr_prod")+V("tr_serv")+C.it_tr_othrev+V("tr_prof")+C.it_tr_duties+C.ov_tr_clsfg;
  C.it_tr_direxp=PV("tr_direxp"); C.it_tr_taxinp=PV("tr_taxinp"); C.it_tr_cop=C.it_mfg_cop;
  C.it_tr_gp = C.it_tr_totinc-(V("tr_opsfg")+V("tr_purch")+C.it_tr_direxp+C.it_tr_taxinp+C.it_tr_cop);
  C.it_tr_intraday=PV("tr_intraday"); C.it_tr_fno=PV("tr_fno");

  /* --- P&L A/c --- */
  C.it_pl_gp     = C.it_tr_gp+C.it_tr_intraday+C.it_tr_fno;
  C.it_pl_othinc = PV("pl_othinc");
  C.it_pl_ins=PV("pl_ins"); C.it_pl_prov=PV("pl_prov"); C.it_pl_sal=PV("pl_sal");
  C.it_pl_taxrates=PV("pl_taxrates"); C.it_pl_othexp=PV("pl_othexp");
  const exp = PL_PLAIN.reduce((a,k)=>a+V(k),0)+C.it_pl_ins+C.it_pl_prov+C.it_pl_sal+C.it_pl_taxrates+C.it_pl_othexp;
  C.it_pl_pbit = C.it_pl_gp+C.it_pl_othinc-exp;
  C.it_pl_pbt  = C.it_pl_pbit-V("pl_interest")-V("pl_dep");
  C.it_pl_pat  = C.it_pl_pbt-V("pl_curtax")-V("pl_deftax");
  C.it_pl_othapp = PV("pl_othapp");
  C.it_pl_bal  = C.it_pl_pat+V("pl_bf")-V("pl_transres")-C.it_pl_othapp;
  C.it_pl_fpay = PV("pl_fpay"); C.it_pl_baddebt = PV("pl_baddebt");

  /* --- Balance Sheet (after the P&L, which feeds the green cell) --- */
  C.it_bs_scoth=PV("bs_scoth"); C.it_bs_othres=PV("bs_othres");
  C.ov_bs_pl = ovr("bs_pl", C.it_pl_bal);
  C.it_bs_ltborr=PV("bs_ltborr"); C.it_bs_stborr=PV("bs_stborr"); C.it_bs_tcred=PV("bs_tcred");
  C.it_bs_ocl=PV("bs_ocl"); C.it_bs_ostp=PV("bs_ostp");
  C.it_bs_totliab = V("bs_paid")+C.it_bs_scoth+V("bs_genres")+C.it_bs_othres+C.ov_bs_pl
    +V("bs_ltbank")+V("bs_ltoth")+C.it_bs_ltborr+V("bs_lttrade")+V("bs_ltothliab")+V("bs_ltempben")
    +V("bs_ltothprov")+V("bs_dtl")
    +V("bs_demand")+C.it_bs_stborr+C.it_bs_tcred+C.it_bs_ocl+V("bs_provemp")+V("bs_provit")+C.it_bs_ostp;

  C.it_bs_nbfa=PV("bs_nbfa"); C.it_bs_ncinv=PV("bs_ncinv"); C.it_bs_ltla=PV("bs_ltla");
  C.it_bs_cinv=PV("bs_cinv"); C.it_bs_invoth=PV("bs_invoth"); C.it_bs_tdeb=PV("bs_tdeb");
  C.it_bs_stla=PV("bs_stla"); C.it_bs_oca=PV("bs_oca");
  C.it_bs_totassets = C.it_bs_nbfa+V("bs_intang")+V("bs_cwip")+C.it_bs_ncinv+V("bs_dta")+C.it_bs_ltla
    +V("bs_lttr")+V("bs_onca")
    +C.it_bs_cinv+V("bs_inv_rm")+V("bs_inv_fg")+V("bs_inv_sit")+C.it_bs_invoth+C.it_bs_tdeb
    +V("bs_bank")+V("bs_cheq")+V("bs_cash")+V("bs_cashoth")+C.it_bs_stla+C.it_bs_oca;
  computeComp(C);
  return C;
}

/* ---- IT Computation ------------------------------------------- */
const parseD = s => {const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s||"").trim());
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;};
const monthsPart = (a,b) => {          /* "every month or part of a month" */
  if(!a||!b||b<=a) return 0;
  let m=(b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate()>a.getDate()) m++;
  return Math.max(1,m);
};
const CR1 = 10000000, CR10 = 100000000;

function computeComp(C){
  /* --- Schedule BP --- */
  C.ov_bp_pbt    = ovr("bp_pbt", C.it_pl_pbt);
  C.ov_bp_specpl = ovr("bp_specpl", C.it_tr_intraday);
  C.it_bp_inccred = PV("bp_inccred"); C.it_bp_incexempt = PV("bp_incexempt");
  C.it_bp_balance = C.ov_bp_pbt - C.ov_bp_specpl - V("bp_35adpl") - C.it_bp_inccred
                  - C.it_bp_incexempt - V("bp_44x");
  C.it_bp_expdeb   = PV("bp_expdeb");
  C.it_bp_adjusted = C.it_bp_balance + C.it_bp_expdeb;
  C.ov_bp_depco    = ovr("bp_depco", V("pl_dep"));
  C.it_bp_depit    = PV("bp_depit");
  C.it_bp_afterdep = C.it_bp_adjusted + C.ov_bp_depco - C.it_bp_depit;
  ["oi_36","oi_37","oi_40","oi_40a","oi_43b"].forEach(k=>C["it_"+k]=PV(k));
  C.it_bp_deemed = PV("bp_deemed");
  C.it_bp_totadd = C.it_oi_36+C.it_oi_37+C.it_oi_40+C.it_oi_40a+C.it_oi_43b
    + V("bp_msmeint")+V("bp_41")+C.it_bp_deemed+V("bp_43ca")+V("bp_othadd")+V("bp_othinc")+V("bp_icdsinc");
  C.it_bp_35esr  = PV("bp_35esr");
  C.it_bp_totded = V("bp_32iii")+V("bp_32ac")+C.it_bp_35esr+V("bp_40now")+V("bp_43bnow")
                 + V("bp_othded")+V("bp_icdsdec");
  C.it_bp_other    = C.it_bp_afterdep + C.it_bp_totadd - C.it_bp_totded;
  C.it_bp_presump  = PV("bp_presump");
  C.it_bp_netother = C.it_bp_other + C.it_bp_presump;
  C.it_bp_spec = PV("bp_spec"); C.it_bp_35ad = PV("bp_35ad");
  /* a speculation or 35AD loss is not set off here — it goes to Schedule CFL */
  C.it_bp_income = C.it_bp_netother + Math.max(0,C.it_bp_spec) + Math.max(0,C.it_bp_35ad);

  /* --- House property --- */
  let av=0,d30=0,dint=0,arr=0;
  (S.r.hp_prop||[]).forEach(r=>{
    const share=(parseFloat(r.pct)||100)/100;
    const a=Math.max(0, num(r.gav)-num(r.unreal)-num(r.localtax))*share;
    av+=a; d30+=a*0.3; dint+=num(r.interest)*share; arr+=num(r.arrears)*0.7;
  });
  C.it_hp_av=Math.round(av); C.it_hp_30=Math.round(d30);
  C.it_hp_int=Math.round(dint); C.it_hp_arr=Math.round(arr);
  C.it_hp_income = C.it_hp_av - C.it_hp_30 - C.it_hp_int + C.it_hp_arr;

  /* --- Capital gains --- */
  ["cg_st111a_o","cg_st111a_n","cg_stapp","cg_lt112a_o","cg_lt112a_n","cg_lt112_o","cg_lt112_n"]
    .forEach(k=>C["it_"+k]=PV(k));
  C.it_cg_sttot = C.it_cg_st111a_o+C.it_cg_st111a_n+C.it_cg_stapp+V("cg_st50");
  C.it_cg_lttot = C.it_cg_lt112a_o+C.it_cg_lt112a_n+C.it_cg_lt112_o+C.it_cg_lt112_n;
  C.it_cg_income = C.it_cg_sttot + C.it_cg_lttot;

  /* --- Other sources --- */
  ["os_div","os_int","os_56x","os_oth","os_spl","os_57"].forEach(k=>C["it_"+k]=PV(k));
  C.it_os_income = C.it_os_div+C.it_os_int+V("os_rent")+C.it_os_56x+C.it_os_oth+C.it_os_spl
                 - C.it_os_57 + V("os_58") + V("os_59");

  /* --- Part B-TI --- */
  C.it_ti_hp=C.it_hp_income; C.it_ti_bp=C.it_bp_income;
  C.it_ti_cg=C.it_cg_income; C.it_ti_os=C.it_os_income;
  C.it_ti_heads = C.it_ti_hp+C.it_ti_bp+C.it_ti_cg+C.it_ti_os;
  C.it_ti_cyla=PV("ti_cyla"); C.it_ti_bfla=PV("ti_bfla");
  C.it_ti_gti = C.it_ti_heads - C.it_ti_cyla - C.it_ti_bfla;
  C.it_ti_via=PV("ti_via"); C.it_ti_10aa=PV("ti_10aa");
  C.it_ti_total  = Math.max(0, C.it_ti_gti - C.it_ti_via - C.it_ti_10aa);
  C.it_ti_si     = PV("ti_si");
  C.it_ti_normal = C.it_ti_total - C.it_ti_si;
  C.it_ti_cfl=PV("ti_cfl"); C.it_ti_ei=PV("ti_ei");

  /* --- Part B-TTI --- */
  const reg=S.v.regime||"", conc=/^115BAA|^115BAB/.test(reg),
        foreign=S.p["cl.status"]==="Foreign Company", TI=C.it_ti_total;
  const rate = /^115BA -/.test(reg)?25 : /^115BAA/.test(reg)?22 : /^115BAB/.test(reg)?15
             : (S.v.to400==="Yes"?30:25);
  C.it_tti_rate = rate+"%";
  C.it_tti_normal  = Math.round(Math.max(0,C.it_ti_normal)*rate/100);
  C.it_tti_special = (S.r.ti_si||[]).reduce((a,r)=>a+num(r.tax),0);
  C.it_tti_ontotinc = C.it_tti_normal + C.it_tti_special;

  const srate = conc ? 10
              : foreign ? (TI>CR10?5 : TI>CR1?2 : 0)
                        : (TI>CR10?12 : TI>CR1?7 : 0);
  let sur = Math.round(C.it_tti_ontotinc*srate/100), mr=0;
  if(!conc && srate>0){                       /* marginal relief on surcharge */
    const thr = TI>CR10 ? CR10 : CR1;
    const taxAtThr = Math.round(thr*rate/100);
    const surAtThr = thr===CR10 ? Math.round(taxAtThr*(foreign?2:7)/100) : 0;
    const cap = taxAtThr + surAtThr + (TI-thr);
    const tot = C.it_tti_ontotinc + sur;
    if(tot>cap) mr = tot-cap;
  }
  C.it_tti_marginal  = mr;
  C.it_tti_surcharge = Math.max(0, sur-mr);
  C.it_tti_cess  = Math.round((C.it_tti_ontotinc+C.it_tti_surcharge)*0.04);
  C.it_tti_gross = C.it_tti_ontotinc + C.it_tti_surcharge + C.it_tti_cess;
  C.it_tti_rel90=PV("tti_rel90"); C.it_tti_rel91=PV("tti_rel91");
  C.it_tti_net = C.it_tti_gross - C.it_tti_rel90 - C.it_tti_rel91;

  /* --- MAT u/s 115JB --- */
  C.it_mat_bookprofit = PV("mat_bp");
  const BP = Math.max(0, C.it_mat_bookprofit);
  if(conc) C.it_mat_tax = 0;
  else {
    const mt = Math.round(BP*0.15);
    const ms = foreign ? (BP>CR10?5 : BP>CR1?2 : 0) : (BP>CR10?12 : BP>CR1?7 : 0);
    const msur = Math.round(mt*ms/100);
    C.it_mat_tax = mt + msur + Math.round((mt+msur)*0.04);
  }
  C.it_mat_payable = conc ? C.it_tti_net : Math.max(C.it_tti_net, C.it_mat_tax);
  C.it_mat_credit  = Math.min(PV("mat_credit"), Math.max(0, C.it_tti_net - C.it_mat_tax));
  C.it_mat_cf = (S.r.mat_credit||[]).reduce((a,r)=>a+num(r.cf),0)
              + Math.max(0, C.it_mat_tax - C.it_tti_net);

  /* --- Taxes paid --- */
  ["tp_adv","tp_tds","tp_tcs","tp_sat"].forEach(k=>C["it_"+k]=PV(k));
  C.it_tp_total = C.it_tp_adv+C.it_tp_tds+C.it_tp_tcs+C.it_tp_sat;

  /* --- Interest and fee --- */
  const assessed = Math.max(0, C.it_mat_payable - C.it_mat_credit);
  const dd = S.p["int_dates.duedate"]==="30th November" ? new Date(2026,10,30) : new Date(2026,9,31);
  const fd = parseD(S.p["int_dates.filedate"]);
  const late = !!(fd && fd>dd);
  const unpaid = Math.max(0, assessed - C.it_tp_total);
  C.it_int_234a = late ? Math.round(Math.floor(unpaid/100)*100 * 0.01 * monthsPart(dd,fd)) : 0;
  const prepaid = C.it_tp_adv + C.it_tp_tds + C.it_tp_tcs;
  const short   = Math.max(0, assessed - prepaid);
  C.it_int_234b = (assessed>10000 && prepaid < assessed*0.9 && fd)
    ? Math.round(Math.floor(short/100)*100 * 0.01 * monthsPart(new Date(2026,3,1), fd)) : 0;
  C.it_int_234c = PV("int_234c");
  C.it_int_234f = late ? (C.it_ti_total<=500000 ? 1000 : 5000) : 0;
  C.it_int_total = C.it_int_234a + C.it_int_234b + C.it_int_234c + C.it_int_234f;
  C.it_tti_aggregate = assessed + C.it_int_total;

  C.it_tti_balance = Math.max(0, C.it_tti_aggregate - C.it_tp_total);
  C.it_tti_refund  = Math.max(0, C.it_tp_total - C.it_tti_aggregate);
}

/* computed cells that live inside a popup (id = pc_<popup>_<row>) */
function computePopupCells(){
  const t=tpsa(), PC={};
  PC.tpsa_t18=t.t18; PC.tpsa_sur=t.sur; PC.tpsa_cess=t.cess;
  PC.tpsa_totA=t.totA; PC.tpsa_paidB=t.paidB; PC.tpsa_netAB=t.netAB;
  [["q1",3],["q2",3],["q3",3],["q4",1]].forEach(x=>{
    PC["int_234c_"+x[0]+"_int"] = Math.round(Math.floor(P("int_234c",x[0]+"_short")/100)*100*0.01*x[1]);
  });
  PC.bs_addl_ltla_yes = PV("bs_ltla")-P("bs_addl","ltla_no");
  PC.bs_addl_stla_yes = PV("bs_stla")-P("bs_addl","stla_no");
  PC.bs_addl_ltr_tot  = P("bs_addl","ltr_sec")+P("bs_addl","ltr_unsec")+P("bs_addl","ltr_doubt");
  document.querySelectorAll(".subform .cv[id^='pc_']").forEach(n=>{
    const key=n.id.slice(3); n.textContent = (key in PC) ? fmt(PC[key]) : "";
  });
}

function computeAll(){
  const C = S.C = compute();

  /* conditional reveal (§5) — one repaint toggles every dependent row */
  SHEET.forEach(sec=>sec.rows.forEach(r=>{
    if(!r.cond) return;
    const n=$(r._rid); if(n) n.style.display = condOn(r.cond) ? "" : "none";
  }));

  /* computed figures */
  document.querySelectorAll("#itpage .cv").forEach(n=>{
    if(n.id in C) n.textContent = typeof C[n.id]==="string" ? C[n.id] : fmt(C[n.id]); });

  /* green overridable cells */
  SHEET.forEach(sec=>sec.rows.forEach(r=>{
    if(r.t!=="ovr") return;
    const n=$("f_"+r.fld);
    if(n && document.activeElement!==n) n.value = fmt(C["ov_"+r.fld]);
  }));

  /* pink = unavailable in this scenario */
  SHEET.forEach(sec=>sec.rows.forEach(r=>{
    if(!r.naif) return;
    const parts=r.naif.split("="), na=parts[1].split("|").includes(S.v[parts[0]]||""), row=$(r._rid); if(!row) return;
    row.querySelectorAll(".st,.cv,.f,.yn-tabs").forEach(n=>n.classList.toggle("na",na));
    const d=row.querySelector(".drillcol"); if(d) d.style.pointerEvents = na?"none":"";
    const st=row.querySelector(".st"); if(st) st.style.pointerEvents = na?"none":"";
  }));

  /* status cells */
  SHEET.forEach(sec=>sec.rows.forEach(r=>{
    if(r.t!=="drill") return;
    const st=$("st_"+r.sf); if(!st) return;
    const s=statusOf(r.sf);
    st.textContent = s.txt; st.classList.toggle("ok",s.ok);
  }));

  /* popup grand bars + popup computed cells */
  Object.keys(SPEC).forEach(k=>{const g=$("gt-"+k); if(g){const v=popupValue(k); g.textContent=v===null?"":fmt(v);}});
  computePopupCells();

  /* rail */
  const core=["assessee","verifier","bank","nature"].filter(k=>statusOf(k).ok).length;
  $("r_core").innerHTML = "Basic info. <b>"+core+"/4</b>";
  const diff=C.it_bs_totassets-C.it_bs_totliab, any=C.it_bs_totassets||C.it_bs_totliab;
  const rbs=$("r_bs");
  rbs.innerHTML = "B/S <b>"+(!any?"&mdash;":(diff===0?"Tallied":"Diff "+fmt(Math.abs(diff)))) + "</b>";
  rbs.className = "pill"+(!any?"":(diff===0?" gr":" red"));
  $("r_pl").innerHTML = "PAT <b>"+(fmt(C.it_pl_pat)||"0")+"</b>";
  const fac=FA_KEYS.reduce((a,k)=>a+SPEC[k].secs.reduce((b,s)=>b+((S.r[s.key]||[]).length),0),0);
  $("r_fa").innerHTML = "FA <b>"+(S.v.fa==="Yes"?fac+" entries":"off")+"</b>";
  const sub=[S.p["cl.status"],S.p["cl.resid"],S.p["cl.name"]||S.p["cl.pan"]].filter(Boolean).join("  \u00b7  ");
  $("topsub").textContent = sub || "\u2014";
  $("r_status").textContent = "Status: "+(S.p["cl.status"]||"\u2014");
}

   7 · Wiring  —  no Save button; every keystroke writes to state
   ================================================================== */
const STACK=[];
function openSF(id){const n=$(id); if(!n)return; n.classList.add("open"); STACK.push(n); document.body.classList.add("locked"); n.scrollTop=0;}
function closeTop(){const n=STACK.pop(); if(n) n.classList.remove("open");
  if(!STACK.length) document.body.classList.remove("locked"); computeAll();}

function onFlagChange(fld,v){ S.v[fld]=v; paintFlags(); computeAll(); }
function paintFlags(){
  document.querySelectorAll(".yn-tabs[data-fld]").forEach(t=>{
    const v=S.v[t.dataset.fld]||"";
    t.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  });
}

document.addEventListener("click",e=>{
  const t=e.target;
  const yn=t.closest&&t.closest(".yn-tabs button");
  if(yn){ e.stopPropagation(); onFlagChange(yn.parentNode.dataset.fld,yn.dataset.v); return; }
  const sf=t.closest&&t.closest("[data-sf]");
  if(sf){ openSF("sf-"+sf.dataset.sf); return; }
  if(t.matches("[data-close],[data-close-co],[data-close-al],[data-close-fa]")){ closeTop(); return; }
  const add=t.closest&&t.closest("[data-add]");
  if(add){ const k=add.dataset.add; S.r[k].push(FACT[k]()); renderTbl(k);
           if(SECOF[k].k==="m") openDetail(SECOF[k].fam,k,S.r[k].length-1); computeAll(); return; }
  const rm=t.closest&&t.closest("[data-rm]");
  if(rm){ const p=rm.dataset.rm.split("|"); S.r[p[0]].splice(+p[1],1); renderTbl(p[0]); computeAll(); return; }
  for(const fam of ["co","al","fa"]){
    const ed=t.closest&&t.closest("[data-"+fam+"edit]");
    if(ed){ const p=ed.dataset[fam+"edit"].split("|"); openDetail(fam,p[0],+p[1]); return; }
  }
  const hd=t.closest&&t.closest(".it-head");
  if(hd){ const g=$(hd.dataset.grp); if(g){ g.classList.toggle("closed");
          hd.querySelector(".tg").innerHTML = g.classList.contains("closed")?"+":"&minus;"; } }
});

function save(t){
  if(t.dataset.v!==undefined)        S.v[t.dataset.v]=t.value;
  else if(t.dataset.ovr!==undefined) S.ovr[t.dataset.ovr]=t.value;
  else if(t.dataset.p!==undefined)   S.p[t.dataset.p] = t.type==="checkbox"?(t.checked?"Y":""):t.value;
  else if(t.dataset.r!==undefined){  const p=t.dataset.r.split("|");
                                     S.r[p[0]][+p[1]][p[2]] = t.type==="checkbox"?(t.checked?"Y":""):t.value; }
  else if(!saveDetail(t))            return false;
  return true;
}
["input","change"].forEach(ev=>document.addEventListener(ev,e=>{
  const t=e.target; if(!t.matches||!t.matches("input,select")) return;
  if(save(t)){ if(t.dataset.p!==undefined) syncClientbar(t); nicSync(t); computeAll(); }
}));
/* Sector drives the Sub-sector list; Sub-sector derives the Code */
function nicSync(t){
  if(t.dataset.r===undefined) return;
  const p=t.dataset.r.split("|"), s=SECOF[p[0]]; if(!s||!s.nic) return;
  const c=(s.cols||[]).find(x=>x[0]===p[2]); if(!c) return;
  if(c[2]==="nicsect"){ S.r[p[0]][+p[1]].sub=""; renderTbl(p[0]); }
  else if(c[2]==="nicsub"){ const n=$("nic_"+p[0]+"_"+p[1]);
    if(n) n.textContent = nicCode(s,S.r[p[0]][+p[1]]); }
}
function syncClientbar(t){
  document.querySelectorAll('.clientbar [data-p="'+t.dataset.p+'"]').forEach(n=>{ if(n!==t) n.value=t.value; });
}

document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t.tagName==="INPUT"&&t.classList.contains("n")){const n=num(t.value); t.value=n?String(n):"";}
  const row=t.closest&&t.closest(".itr");
  document.querySelectorAll(".itr.focus").forEach(n=>n.classList.remove("focus"));
  if(row) row.classList.add("focus");
});
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t.tagName==="INPUT"&&t.classList.contains("n")) t.value=fmt(num(t.value));
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&STACK.length){e.preventDefault(); closeTop();} });

function showScreen(s){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.scr===s));
  const isVal = s==="val";
  $("valpane").style.display = isVal ? "" : "none";
  document.querySelector(".sheetwrap").style.display = isVal ? "none" : "";
  if(!isVal) document.querySelectorAll("#itpage [data-scr]").forEach(n=>{
    n.style.display = n.dataset.scr===s ? "" : "none"; });

  window.scrollTo(0,0);
}

/* ---- rules. Patterns and lengths follow the CBDT JSON schema. ---- */
const PAN_RE = /^[A-Z]{5}[0-9]{4}[A-Z]$/, IFSC_RE = /^[A-Z]{4}0[A-Z0-9]{6}$/;
const MAIL_RE= /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/, DATE_RE = /^\d{2}\/\d{2}\/\d{4}$/;
const VG = k => String((k.indexOf(".")>0 ? S.p[k] : S.v[k]) || "").trim();

const VRULES = [
 {s:"itr", p:"Name of the company",       k:"cl.name",  req:1, max:75},
 {s:"itr", p:"PAN",                       k:"cl.pan",   req:1, re:PAN_RE, hint:"AAAAA0000A"},
 {s:"itr", p:"Status",                    k:"cl.status", req:1},
 {s:"itr", p:"Residential Status",        k:"cl.resid", req:1},
 {s:"itr", p:"Date of Incorporation",     k:"cl.doi",   req:1, re:DATE_RE, hint:"DD/MM/YYYY"},
 {s:"itr", p:"Assessee info \u00b7 e-Mail ID", k:"assessee.email", req:1, re:MAIL_RE},
 {s:"itr", p:"Assessee info \u00b7 Status",    k:"assessee.status", req:1},
 {s:"itr", p:"Assessee info \u00b7 unlisted?",  k:"assessee.unlisted", req:1},
 {s:"itr", p:"Verifier \u00b7 Name",       k:"verifier.name",  req:1, max:75},
 {s:"itr", p:"Verifier \u00b7 PAN",        k:"verifier.pan",   req:1, re:PAN_RE},
 {s:"itr", p:"Verifier \u00b7 Capacity",   k:"verifier.capacity", req:1},
 {s:"itr", p:"Verifier \u00b7 Place of signing", k:"verifier.place", req:1, max:50},
 {s:"itr", p:"Section under which filed", k:"sec",      req:1},
 {s:"itr", p:"Return Type",               k:"rettype",  req:1},
 {s:"itr", p:"Liable for audit u/s 44AB?",k:"aud44ab",  req:1},
 {s:"itr", p:"Startup \u00b7 recognition no.", k:"dpiit_no", req:1, when:()=>S.v.dpiit==="Yes"},
 {s:"itr", p:"Startup \u00b7 IMB certificate no.", k:"imb_no", req:1, when:()=>S.v.dpiit==="Yes"&&S.v.imb==="Yes"},
 {s:"itr", p:"MSME \u00b7 registration no.", k:"msme_no", req:1, when:()=>S.v.msme==="Yes"},
 {s:"itr", p:"Tax audit \u00b7 auditor's name", k:"aud44ab_det.aname", req:1, when:()=>S.v.aud44ab==="Yes"},
 {s:"itr", p:"Tax audit \u00b7 membership no.", k:"aud44ab_det.amem", req:1, when:()=>S.v.aud44ab==="Yes"},
 {s:"itr", p:"Tax audit \u00b7 UDIN", k:"aud44ab_det.udin", req:1, when:()=>S.v.aud44ab==="Yes"},
 {s:"itr", p:"Tax audit \u00b7 date of report", k:"aud44ab_det.repdt", req:1, re:DATE_RE, when:()=>S.v.aud44ab==="Yes"},
 {s:"comp",p:"Tax rate option",           k:"regime",   req:1},
 {s:"comp",p:"Turnover > \u20b9400 crore?", k:"to400", req:1, when:()=>!/^115BA/.test(S.v.regime||"")},
 {s:"comp",p:"Filing dates \u00b7 due date", k:"int_dates.duedate", req:1},
 {s:"comp",p:"Filing dates \u00b7 date of filing", k:"int_dates.filedate", req:1, re:DATE_RE}
];

function validate(){
  const C=S.C, out=[];
  const add=(lvl,p,m,s)=>out.push({lvl:lvl,p:p,m:m,s:s||"itr"});

  VRULES.forEach(r=>{
    if(r.when && !r.when()) return;
    const v=VG(r.k);
    if(r.req && !v)          return add("err", r.p, "is required", r.s);
    if(!v) return;
    if(r.max && v.length>r.max) return add("err", r.p, "is longer than "+r.max+" characters", r.s);
    if(r.re && !r.re.test(v))   return add("err", r.p, "is not in the expected format"+(r.hint?" ("+r.hint+")":""), r.s);
  });

  /* structural checks the schema cannot express */
  const banks=(S.r.bank||[]).filter(b=>String(b.bank||"").trim());
  if(!banks.length) add("err","Bank Accounts","at least one bank account must be entered","itr");
  banks.forEach((b,i)=>{ if(b.ifsc && !IFSC_RE.test(String(b.ifsc).toUpperCase()))
    add("err","Bank Accounts \u00b7 row "+(i+1),"IFS Code is not in the expected format (ABCD0123456)","itr"); });
  if(banks.length && !banks.some(b=>b.refund==="Y"))
    add("err","Bank Accounts","one account must be ticked for refund","itr");

  const nob=nobRows().map(x=>x[1]);
  if(!nob.length) add("err","Nature of Business / Profession","at least one business must be entered","itr");
  nob.forEach((r,i)=>{ if(r.sect && !r.sub)
    add("err","Nature of Business \u00b7 row "+(i+1),"sub-sector is required so the code can be derived","itr"); });

  if(S.v.mtpl==="Yes"){
    const diff = C.it_bs_totassets - C.it_bs_totliab;
    if(diff!==0 && (C.it_bs_totassets||C.it_bs_totliab))
      add("err","Balance Sheet","total assets and total liabilities differ by "+fmt(Math.abs(diff)),"itr");
  }
  if(S.v.fa==="Yes" && !FA_KEYS.some(k=>(S.r[k]||[]).length))
    add("warn","Foreign Assets","the flag is Yes but no entry has been made","itr");
  if(S.v.td==="Yes" && !V("td_fmvtot"))
    add("warn","Accreted income u/s 115TD","the flag is Yes but the aggregate FMV is blank","itr");

  const conc=/^115BAA|^115BAB/.test(S.v.regime||"");
  if(conc && PV("mat_bp"))
    add("warn","MAT u/s 115JB","a book profit is entered but 115JB does not apply under "+S.v.regime,"comp");
  if(conc && (P("ti_via","s80g")||P("ti_via","s80ia")||P("ti_via","s80iab")||P("ti_via","s80iac")))
    add("warn","Chapter VI-A","under "+S.v.regime+" only 80JJAA, 80M and 80LA(1A) are available","comp");
  if(Math.abs(C.ov_bp_pbt - C.it_pl_pbt)>0 && C.it_pl_pbt)
    add("warn","Schedule BP","profit before tax has been overridden and no longer matches the P&L A/c","comp");
  if(C.it_ti_si && !(S.r.ti_si||[]).some(r=>num(r.tax)))
    add("warn","Schedule SI","income at special rates is entered but no tax has been computed against it","comp");

  if(!out.length) add("ok","All checks","no errors found \u2014 the return can be exported","itr");
  return out;
}

function renderValidation(){
  const res=validate(), errs=res.filter(r=>r.lvl==="err").length, warns=res.filter(r=>r.lvl==="warn").length;
  $("v_list").innerHTML = res.map(r=>
    `<div class="vrow ${r.lvl}"><span class="vk">${r.lvl==="err"?"Error":r.lvl==="warn"?"Check":"Passed"}</span>`+
    `<span class="vp">${esc(r.p)}</span><span class="vm">${esc(r.m)} `+
    (r.lvl==="ok"?"":`<a data-goto="${r.s}">go to ${r.s==="itr"?"ITR Info":"IT Computation"}</a>`)+`</span></div>`).join("");
  $("v_sum").textContent = errs+" error"+(errs===1?"":"s")+", "+warns+" thing"+(warns===1?"":"s")+" to check. "+
    (errs?"Fix the errors to enable the download.":"Ready to export.");
  $("btnExport").disabled = errs>0;
  $("v_when").textContent = "run at "+new Date().toLocaleTimeString();
}
$("btnValidate").addEventListener("click", renderValidation);

/* ==================== HOST-APP BRIDGE ====================
   CA-Studio wires company master data into this sheet two ways:
   1. localStorage 'ca_tax_bridge' written by the shell before load
   2. postMessage { type:'HYDRATE_ITR', payload:{ companyName, pan, doi } }
   Values are applied through the sheet's own inputs (value + input event),
   so its normal save/compute pipeline handles them; existing user-entered
   values are never overwritten. */
(function(){
  function setField(id, val){
    if(val == null || val === '') return;
    var el = document.getElementById(id);
    if(!el || el.value) return;
    el.value = String(val);
    el.dispatchEvent(new Event('input',  { bubbles:true }));
    el.dispatchEvent(new Event('change', { bubbles:true }));
  }
  function toDDMMYYYY(raw){
    if(!raw) return '';
    var m = String(raw).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[3] + '/' + m[2] + '/' + m[1];
    return String(raw);
  }
  function applyBridge(b){
    if(!b) return;
    setField('cl_name', b.companyName || b.name);
    setField('cl_pan', (b.pan || '').toUpperCase());
    setField('cl_doi', toDDMMYYYY(b.doi));
  }
  try{ applyBridge(JSON.parse(localStorage.getItem('ca_tax_bridge') || 'null')); }catch(e){}
  window.addEventListener('message', function(ev){
    if(ev.origin !== window.location.origin) return;
    var d = ev.data;
    if(d && d.type === 'HYDRATE_ITR' && d.payload) applyBridge(d.payload);
  });
})();
</script>
