<title>ITR Structure Map — Forms · Particulars · Drill-ins · Heads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ground:#f6f8fc; --surface:#ffffff; --surface-2:#f0f4fb;
    --ink:#16203a; --muted:#5b6b86; --faint:#8695ac;
    --line:#dce4f1; --line-strong:#c4d1e6;
    --accent:#2f52c9; --accent-deep:#1d3a8f; --accent-soft:#e7edfb;
    --drill:#b4690e; --drill-soft:#fbf0dd;
    --ready:#0e7a5f; --ready-soft:#e4f3ee;
    --form:#1d3a8f;
    --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono","Consolas",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0c1120; --surface:#131a2c; --surface-2:#182238;
      --ink:#e8edf7; --muted:#9fb0cc; --faint:#6f809e;
      --line:#26314b; --line-strong:#33425f;
      --accent:#7b95f2; --accent-deep:#9db3fb; --accent-soft:#1a2542;
      --drill:#e0a martes; --drill:#e6a856; --drill-soft:#33260f;
      --ready:#4bc9a2; --ready-soft:#0f2b23;
      --form:#9db3fb;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --ground:#f6f8fc; --surface:#ffffff; --surface-2:#f0f4fb; --ink:#16203a; --muted:#5b6b86; --faint:#8695ac;
    --line:#dce4f1; --line-strong:#c4d1e6; --accent:#2f52c9; --accent-deep:#1d3a8f; --accent-soft:#e7edfb;
    --drill:#b4690e; --drill-soft:#fbf0dd; --ready:#0e7a5f; --ready-soft:#e4f3ee; --form:#1d3a8f;
    --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
  }
  :root[data-theme="dark"]{
    --ground:#0c1120; --surface:#131a2c; --surface-2:#182238; --ink:#e8edf7; --muted:#9fb0cc; --faint:#6f809e;
    --line:#26314b; --line-strong:#33425f; --accent:#7b95f2; --accent-deep:#9db3fb; --accent-soft:#1a2542;
    --drill:#e6a856; --drill-soft:#33260f; --ready:#4bc9a2; --ready-soft:#0f2b23; --form:#9db3fb;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* ── header ── */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1120px;margin:0 auto;padding:14px 20px 12px}
  .htop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  h1 .tag{color:var(--accent);font-weight:800}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px 8px 32px;font-size:13.5px;font-family:var(--sans)}
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
  button.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  button.btn:hover{background:var(--surface-2);border-color:var(--accent)}
  button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:var(--sans)}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.on .cn{color:rgba(255,255,255,.8)}
  .cn{color:var(--faint);font-weight:600;margin-left:5px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--muted)}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* ── tree ── */
  main{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .form{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .form.hide{display:none}
  .frow{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .frow:hover{background:var(--surface-2)}
  .fnum{flex:none;width:44px;height:44px;border-radius:11px;background:linear-gradient(145deg,var(--accent-deep),var(--accent));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
  .fnum small{font-size:8px;font-weight:700;opacity:.8;letter-spacing:.5px;margin-bottom:2px}
  .fnum b{font-size:17px}
  .ftext{flex:1;min-width:0}
  .ftitle{font-weight:750;font-size:15.5px}
  .ftitle .short{color:var(--accent);font-weight:800;margin-right:7px}
  .fnote{color:var(--muted);font-size:12px;margin-top:1px}
  .fmeta{flex:none;display:flex;align-items:center;gap:8px}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
  .pill.pend{color:var(--drill);background:var(--drill-soft);border-color:transparent}
  .pill.ready{color:var(--ready);background:var(--ready-soft);border-color:transparent}
  .chev{flex:none;color:var(--faint);transition:transform .18s ease}
  .open>.frow .chev,.open>.node>.chev,.node.open>.chev{transform:rotate(90deg)}

  .kids{display:none;padding:0 0 10px}
  .form.open>.kids{display:block}

  /* generic node (group / particular / head) */
  .node{position:relative}
  .nrow{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:8px;cursor:default}
  .nrow.can:hover{background:var(--surface-2)}
  .nrow.can{cursor:pointer;user-select:none}
  .chev-s{flex:none;width:14px;color:var(--faint);transition:transform .16s ease;font-size:11px;text-align:center}
  .node.open>.nrow .chev-s{transform:rotate(90deg)}
  .node>.kids2{display:none}
  .node.open>.kids2{display:block}

  /* indentation guides */
  .lvl{margin-left:20px;border-left:1px solid var(--line);padding-left:4px}
  .lvl>.node>.nrow::before{content:"";position:absolute;left:-4px;top:16px;width:12px;height:1px;background:var(--line)}
  .node>.nrow{position:relative}

  .glyph{flex:none;width:16px;height:16px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
  .g-group{background:var(--accent-soft);color:var(--accent-deep)}
  .g-part{background:transparent;color:var(--faint)}
  .g-part::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
  .g-head{background:var(--accent);color:#fff;border-radius:4px}

  .label{flex:1;min-width:0;font-size:13.5px}
  .label .lawcode{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .grp .label{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .headnode>.nrow .label{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent-deep)}
  .ct{flex:none;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}

  .drillbadge{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--drill);background:var(--drill-soft);border-radius:999px;padding:2px 7px;letter-spacing:.3px}
  .drillbadge b{font-size:12px;line-height:.6;letter-spacing:1px}

  /* ready particulars — the leaf rows */
  .ready-wrap{margin-left:20px;border-left:1px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-wrap:wrap;gap:5px 6px}
  .rchip{font-family:var(--mono);font-size:11.5px;color:var(--ready);background:var(--ready-soft);border:1px solid color-mix(in srgb,var(--ready) 22%,transparent);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .headnode .ready-wrap{border-left-color:color-mix(in srgb,var(--accent) 30%,transparent)}

  mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  footer{max-width:1120px;margin:0 auto;padding:0 20px 50px;color:var(--faint);font-size:11.5px;line-height:1.6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="hwrap">
    <div class="htop">
      <div>
        <h1><span class="tag">ITR</span> Structure Map</h1>

        <input id="q" type="search" placeholder="Search particulars, drill-ins, heads, sections (e.g. 44AD, 80C, capital gains, verifier)…" autocomplete="off">

    </div>
  </div>
</header>

   item:  {p:'particular', drill?:true, r?:['ready','vals'], h?:[head]}

 {G:"Computation outputs",i:[

/* ── RENDER ─────────────────────────────────────────────────────────────── */
const tree=document.getElementById('tree');
const CHEV='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
const CHEVS='<span class="chev-s">▸</span>';

function countLeaves(f){ // particulars + heads + ready under a form
  let p=0,d=0;
  f.g.forEach(gr=>gr.i.forEach(it=>{p++; if(it.drill)d++;}));
  return {p,d};
}
function readyWrap(rows){
  if(!rows||!rows.length) return '';
  return '<div class="ready-wrap">'+rows.map(r=>'<span class="rchip">'+esc(r)+'</span>').join('')+'</div>';
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function headNode(hd){
  const hasR=hd.r&&hd.r.length;
  return `<div class="node headnode ${hasR?'':'leaf'}">
    <div class="nrow ${hasR?'can':''}">${hasR?CHEVS:'<span class="chev-s"></span>'}
      <span class="glyph g-head">H</span>
      <span class="label">${esc(hd.H)}</span>
      ${hasR?`<span class="ct">${hd.r.length}</span>`:''}
    </div>${hasR?readyWrap(hd.r):''}</div>`;
}
function itemNode(it){
  const hasH=it.h&&it.h.length, hasR=it.r&&it.r.length, can=hasH||hasR;
  let inner='';
  if(hasH) inner='<div class="lvl">'+it.h.map(headNode).join('')+'</div>';
  else if(hasR) inner=readyWrap(it.r);
  return `<div class="node ${can?'':'leaf'}">
    <div class="nrow ${can?'can':''}">${can?CHEVS:'<span class="chev-s"></span>'}
      <span class="glyph g-part"></span>
      <span class="label">${esc(it.p)}</span>
      ${it.drill?'<span class="drillbadge"><b>⋯</b> drill-in</span>':''}
      ${hasH?`<span class="ct">${it.h.length} heads</span>`:''}
    </div>${can?`<div class="kids2">${inner}</div>`:''}</div>`;
}
function groupNode(gr){
  return `<div class="node grp">
    <div class="nrow can">${CHEVS}
      <span class="glyph g-group">▤</span>
      <span class="label">${esc(gr.G)}</span>
      <span class="ct">${gr.i.length}</span>
    </div>
    <div class="kids2"><div class="lvl">${gr.i.map(itemNode).join('')}</div></div>
  </div>`;
}
function formNode(f){
  const c=countLeaves(f);
  const pend=f.t==='⚠ Pending';
  return `<section class="form" data-form="${f.n}">
    <div class="frow">
      <div class="fnum"><small>ITR</small><b>${f.n}</b></div>
      <div class="ftext">
        <div class="ftitle"><span class="short">ITR-${f.n}${f.t&&!pend?' '+esc(f.t):''}</span>${esc(f.d)}</div>
      </div>
      <div class="fmeta">
        ${pend?'<span class="pill pend">⚠ Pending</span>':''}
        <span class="pill">${f.g.length} groups</span>
        <span class="pill">${c.p} particulars</span>
        <span class="pill ready">${c.d} drill-ins</span>
      </div>
      ${CHEV}
    </div>
    <div class="kids"><div style="padding:2px 14px 4px">${f.g.map(groupNode).join('')}</div></div>
  </section>`;
}
tree.innerHTML=D.map(formNode).join('');

/* counts for chips */
const chips=document.getElementById('chips');
let chipHtml='<button class="chip on" data-f="all">All forms</button>';
D.forEach(f=>chipHtml+=`<button class="chip" data-f="${f.n}">ITR-${f.n}<span class="cn">${f.g.reduce((a,g)=>a+g.i.length,0)}</span></button>`);
chips.innerHTML=chipHtml;

/* ── INTERACTION ─── */
tree.addEventListener('click',e=>{
  const fr=e.target.closest('.frow');
  if(fr){fr.parentElement.classList.toggle('open');return;}
  const nr=e.target.closest('.nrow.can');
  if(nr){nr.parentElement.classList.toggle('open');}
});
document.getElementById('expand').onclick=()=>document.querySelectorAll('.form,.node').forEach(n=>{if(n.querySelector(':scope>.kids,:scope>.kids2,:scope>.nrow.can,:scope>.frow'))n.classList.add('open')});
document.getElementById('collapse').onclick=()=>{document.querySelectorAll('.form,.node').forEach(n=>n.classList.remove('open'));};

/* chips scope */
chips.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); b.classList.add('on');
  const f=b.dataset.f;
  document.querySelectorAll('.form').forEach(s=>{
    const show=f==='all'||s.dataset.form===f; s.classList.toggle('hide',!show);
    if(f!=='all'&&show) s.classList.add('open');
  });
});

/* search */
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const term=q.value.trim().toLowerCase();
  // reset marks
  document.querySelectorAll('mark').forEach(m=>{m.replaceWith(document.createTextNode(m.textContent));});
  if(!term){
    document.querySelectorAll('.form,.node').forEach(n=>{n.classList.remove('open');n.style.display='';});
    // re-apply active chip scope
    chips.querySelector('.chip.on').click();
    document.getElementById('empty-msg')?.remove();
    return;
  }
  let anyForm=false;
  document.querySelectorAll('.form').forEach(form=>{
    form.classList.remove('hide');
    let hit=false;
    form.querySelectorAll('.label,.rchip').forEach(el=>{
      const t=el.textContent.toLowerCase();
      if(t.includes(term)){
        hit=true;
        // open ancestors
        let p=el.closest('.node')||el.closest('.form');
        while(p){p.classList.add('open'); p=p.parentElement.closest('.node,.form');}
        // highlight
        const idx=el.textContent.toLowerCase().indexOf(term);
        if(idx>=0&&!el.querySelector('mark')){
          const orig=el.textContent;
          el.innerHTML=esc(orig.slice(0,idx))+'<mark>'+esc(orig.slice(idx,idx+term.length))+'</mark>'+esc(orig.slice(idx+term.length));
        }
      }
    });
    // also match form header text
    const fd=form.querySelector('.ftitle').textContent.toLowerCase();
    if(fd.includes(term)) {hit=true; form.classList.add('open');}
    form.style.display=hit?'':'none';
    if(hit)anyForm=true;
  });
  document.getElementById('empty-msg')?.remove();
  if(!anyForm){tree.insertAdjacentHTML('beforeend','<div class="empty" id="empty-msg">No particular, drill-in or head matches “'+esc(term)+'”.</div>');}
});

/* theme toggle */
const root=document.documentElement;
document.getElementById('theme').onclick=()=>{
  const cur=root.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  root.setAttribute('data-theme',cur==='dark'?'light':'dark');
};

 'ITR-6 is marked <b>pending</b> — its on-screen shell exists but the JSON is totals-only. See <code>docs/itr/</code> for the field-level mapping &amp; validation rules.';

/* open ITR-1 by default */
document.querySelector('.form').classList.add('open');
</script>
